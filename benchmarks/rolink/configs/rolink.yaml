defaults:
- env/maniskill_put_on_plate_in_scene_25_main@env.train
- env/maniskill_put_on_plate_in_scene_25_main@env.eval
- model/pi0@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 2
  node_groups:
  - label: edge
    node_ranks: '0'
  - label: cloud
    node_ranks: '1'
  component_placement:
    env:
      node_group: edge
      placement: 0-3
    rollout:
      node_group: edge,cloud
      placement: 0-7
    actor:
      node_group: cloud
      placement: 0-3
  network:
    sites:
      edge:
        node_ranks:
        - 0
      cloud:
        node_ranks:
        - 1
    links:
    - src: edge
      dst: cloud
      bandwidth_mbps: 5000
      latency_ms: 0
    - src: cloud
      dst: edge
      bandwidth_mbps: 5000
      latency_ms: 0
  net_emulation:
    enabled: false
runner:
  task_type: embodied
  rolink:
    enable_sharding: true
    min_shard: 1
    max_env_requests: 1
    batch_timeout_ms: 100
    routing: load_aware
    profile_path: ${oc.env:EMBODIED_PATH}/config/rolink_openpi_inference_profile.json
    profile_by_site:
      edge: edge
      cloud: cloud
  logger:
    log_path: ./logs/rolink
    project_name: rlinf
    experiment_name: seed-0
    logger_backends:
    - tensorboard
  max_epochs: 10
  max_steps: 10
  only_eval: false
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
  trajectory_channel_node_rank: 1
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: chunk_level
  update_epoch: 4
  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: token-mean
  bootstrap_type: always
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
  staleness_threshold: 1
  behave_weight_threshold: 2
env:
  group_name: EnvGroup
  train:
    requires_gpu: true
    rollout_epoch: 1
    total_num_envs: 256
    auto_reset: true
    use_fixed_reset_state_ids: false
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    init_params:
      use_multiple_plates: false
    seed: 0
    enable_offload: false
  eval:
    rollout_epoch: 1
    total_num_envs: 256
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    use_fixed_reset_state_ids: true
    group_size: ${algorithm.group_size}
    is_eval: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      use_multiple_plates: false
    seed: 0
    enable_offload: false
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1
  enable_cuda_graph: false
  model:
    model_path: ${oc.env:ROLINK_MODEL_PATH}
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 4096
  seed: 0
  enable_offload: false
  model:
    model_path: ${oc.env:ROLINK_MODEL_PATH}
    model_name: openpi
    precision: null
    num_action_chunks: 5
    action_dim: 7
    add_value_head: true
    openpi:
      task: rl
      config_name: pi0_maniskill
      num_images_in_input: 1
      noise_method: flow_noise
      action_horizon: 8
      noise_params:
      - 0.16
      - 0.12
      - 200
      detach_critic_input: true
      joint_logprob: true
      value_after_vlm: false
    policy_setup: widowx_bridge
  optim:
    lr: 7.91e-06
    value_lr: 0.000155
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
