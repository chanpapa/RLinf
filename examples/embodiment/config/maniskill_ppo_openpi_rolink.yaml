defaults:
  - env/maniskill_put_on_plate_in_scene_25_main@env.train
  - env/maniskill_put_on_plate_in_scene_25_main@env.eval
  - model/pi0@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Two nodes with four GPUs each. Set RLINF_NODE_RANK before starting Ray:
# node 0 = edge; node 1 = cloud.
cluster:
  num_nodes: 2
  node_groups:
    - label: edge
      node_ranks: "0"
    - label: cloud
      node_ranks: "1"
  component_placement:
    env:
      node_group: edge
      placement: 0-3
    rollout:
      node_group: edge,cloud
      placement: 0-5  # Edge GPUs 0-3 and cloud GPUs 0-1.
    actor:
      node_group: cloud
      placement: 2-3

  # Declared link capacities used by load-aware routing; no traffic throttling.
  network:
    sites:
      edge:
        node_ranks: [0]
      cloud:
        node_ranks: [1]
    # Directed links; latency_ms is one-way latency, not RTT.
    links:
      - src: edge
        dst: cloud
        bandwidth_mbps: 1000
        latency_ms: 20
      - src: cloud
        dst: edge
        bandwidth_mbps: 1000
        latency_ms: 20

runner:
  task_type: embodied
  rolink:
    enable_sharding: true
    min_shard: 1  # One environment per shard; shards can be batched per rollout.
    max_env_requests: 2  # Env/stage requests grouped before GPU assignment.
    batch_timeout_ms: 100  # Dispatch a partial group when its oldest request expires.
    routing: load_aware  # uniform keeps equal shard counts.
    profile_path: ${oc.env:EMBODIED_PATH}/config/rolink_openpi_inference_profile.json
    # Profile JSON: inference.<label>.time_s maps batch size to seconds.
    # Omit this mapping when labels are the detected accelerator_model names.
    profile_by_site:
      edge: edge
      cloud: cloud
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "maniskill_ppo_openpi_rolink"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: 10
  save_interval: 50

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: chunk_level
  update_epoch: 4

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"

  bootstrap_type: always # [standard, always]. Bootstrap Q-values according to terminations and truncations. "standard" only bootstraps when truncations, while "always" bootstraps when truncations or terminations.
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
env:
  group_name: "EnvGroup"

  # Override the default values in env/train or env/eval
  train:
    # GPU simulation/rendering shares edge GPUs with rollout. Shared rollouts
    # serve their colocated envs' current group while those envs wait for actions.
    # Use false for environments that do not use a GPU.
    requires_gpu: true
    rollout_epoch: 1
    total_num_envs: 192
    auto_reset: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 80 # max episode steps for truncation
    max_steps_per_rollout_epoch: 80
    init_params:
      use_multiple_plates: False
  eval:
    rollout_epoch: 1
    total_num_envs: 192
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    use_fixed_reset_state_ids: True
    group_size: ${algorithm.group_size}
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      use_multiple_plates: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1
  enable_cuda_graph: false  # Shard routing produces variable inference batch sizes.

  model:
    model_path: "/path/to/model/RLinf-Pi0-ManiSkill-25Main-SFT" # https://huggingface.co/RLinf/RLinf-Pi0-ManiSkill-25Main-SFT
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32      # how many samples each GPU processes per sampling step
  global_batch_size: 3072  # 192 envs * (80 steps / 5 actions per chunk).
  seed: 0
  enable_offload: False
  # Override the default values in model/pi0
  model:
    model_path: "/path/to/model/RLinf-Pi0-ManiSkill-25Main-SFT" # https://huggingface.co/RLinf/RLinf-Pi0-ManiSkill-25Main-SFT
    model_name: "openpi"
    precision: null    # bf16
    num_action_chunks: 5 # interface for the env
    action_dim: 7
    add_value_head: True
    # openpi specific parameters
    openpi:
      task: rl
      config_name: "pi0_maniskill"
      num_images_in_input: 1
      noise_method: "flow_noise"
      action_horizon: 8
      noise_params: [0.16, 0.12, 200]
      detach_critic_input: True
      joint_logprob: True # False for flow_sde, True for flow_noise
      value_after_vlm: False      # pi0: False. pi0.5: True
    policy_setup: widowx_bridge

  optim:
    lr: 7.91e-6
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    critic_warmup_steps: 0

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: False

critic:
  use_critic_model: False
